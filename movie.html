<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Movie Details | TRIOFLEX</title>

    <link rel="stylesheet" href="STYLE/style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">TRIO<span>FLEX</span></div>
        <nav>

            <a href="home.html">Home</a>

            <a href="home.html#popular">Trending</a>

            <a href="home.html#movies">Movies</a>

            <a href="home.html#dramas">Dramas</a>

            <a href="home.html#anime">Anime</a>

        </nav>

        <!-- <div class="nav-right">

            <input type="text" id="searchInput" placeholder="Search movies...">

            <button class="login-btn">Login</button>

        </div> -->

    </header>

    <main class="movie-detail">

    <!-- Background Image -->
        <div class="movie-poster">
            <img id="moviePoster" alt="Movie background">
        </div>

        <!-- Dark Overlay -->
        <div class="movie-detail-overlay"></div>

        <!-- Movie Content -->
        <section class="movie-information">

            <!-- Release Year -->
            <span id="movieYear" class="movie-year"></span>

            <!-- Movie Title -->
            <h1 id="movieTitle"></h1>

            <!-- Movie Metadata -->
            <div class="movie-meta">
                <span id="movieAgeRating"></span>
                <span id="movieGenre"></span>
                <span id="movieRating"></span>
                <span id="movieEpisodes"></span>
            </div>
            <!-- Poster and Cast -->
            <div class="movie-extra">

                <div class="movie-cover">
                    <img id="movieCover" alt="Movie poster">
                </div>

                <div class="movie-cast-section">
                    <h3>CASTS:</h3>
                    <div id="movieCast"></div>
                        <a href="#" class="see-more">...See m    ore</a>
                </div>

            </div>

            <!-- Movie Description -->
            <p id="moviePlot"></p>

            <!-- Trailer -->
            <div class="trailer-section">
                <a id="movieTrailer" class="trailer-link" target="_blank" rel="">
                    Watch Official Trailer
                </a>
            </div>    

        </section>

    </main>
    <script src="JS/detail.js"></script>

</body>
</html>
